# Сборка BoostyDumper в один .exe под Windows.
#
# Запускается:
#   * по пушу тега v*  → пересобирает .exe и публикует GitHub Release;
#   * по пушу в main    → только сборка + artifact (проверка, что ничего не сломалось);
#   * вручную (вкладка Actions → Run workflow).
#
# Результат сборки — один файл dist/BoostyDumper.exe (см. boosty_dumper.spec).

name: Build Windows .exe

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# softprops/action-gh-release нужен доступ к релизам/тегам.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: pyinstaller boosty_dumper.spec --noconfirm

      - name: Compute checksum
        # SHA-256 рядом с .exe — чтобы пользователь мог проверить целостность.
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/BoostyDumper.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  BoostyDumper.exe" | Out-File -Encoding ascii dist/BoostyDumper.exe.sha256
          Get-Content dist/BoostyDumper.exe.sha256

      - name: Upload artifact
        # Доступен во вкладке Actions ~90 дней. Не публичный.
        uses: actions/upload-artifact@v4
        with:
          name: BoostyDumper-windows-exe
          path: |
            dist/BoostyDumper.exe
            dist/BoostyDumper.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        # Только при теге v* — для обычного пуша в main релиза не будет.
        #
        # Используем gh CLI вместо softprops/action-gh-release: при повторном
        # запуске на том же теге action падал с «release assets name has already
        # taken», т.к. не умеет перезаписывать одноимённые ассеты. Флаг
        # --clobber у gh именно для этого. gh предустановлен на windows-latest.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"

          # Создаём релиз, если его ещё нет на этом теге.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag уже существует — обновляем ассеты."
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --generate-notes
          fi

          # --clobber перезаписывает BoostyDumper.exe/.sha256, если они уже есть.
          gh release upload "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            dist/BoostyDumper.exe \
            dist/BoostyDumper.exe.sha256
