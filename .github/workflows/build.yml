# Сборка BoostyDumper в один .exe под Windows.
#
# Запускается:
#   * по пушу тега v*  → пересобирает .exe и публикует GitHub Release;
#   * по пушу в main    → только сборка + artifact (проверка, что ничего не сломалось);
#   * вручную (вкладка Actions → Run workflow).
#
# Результат сборки — один файл dist/BoostyDumper.exe (см. boosty_dumper.spec).

name: Build Windows .exe

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# softprops/action-gh-release нужен доступ к релизам/тегам.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: pyinstaller boosty_dumper.spec --noconfirm

      - name: Compute checksum
        # SHA-256 рядом с .exe — чтобы пользователь мог проверить целостность.
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/BoostyDumper.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  BoostyDumper.exe" | Out-File -Encoding ascii dist/BoostyDumper.exe.sha256
          Get-Content dist/BoostyDumper.exe.sha256

      - name: Upload artifact
        # Доступен во вкладке Actions ~90 дней. Не публичный.
        uses: actions/upload-artifact@v4
        with:
          name: BoostyDumper-windows-exe
          path: |
            dist/BoostyDumper.exe
            dist/BoostyDumper.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        # Только при теге v* — для обычного пуша в main релиза не будет.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BoostyDumper.exe
            dist/BoostyDumper.exe.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
